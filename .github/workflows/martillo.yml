name: martillo

on:
  push:
    branches: [ci-cuelgue]

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variante: [musica, sin-loop, sin-compresor, dos-grafos, dec-1-hilo, fc-1-hilo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --ignore-scripts
      - run: bash .github/martillo/correr.sh ${{ matrix.variante }} 40
